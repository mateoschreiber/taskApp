<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#df122d">
  <meta name="application-name" content="taskApp">
  <meta name="apple-mobile-web-app-title" content="taskApp">
  <title>{% block title %}taskApp · Registro de tareas{% endblock %}</title>
  <link rel="icon" sizes="32x32" type="image/png" href="/icon-32.png">
  <link rel="icon" sizes="any" type="image/svg+xml" href="/mark.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/workspace.css">
  <script src="/app.js" type="module"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block bodyclass %}workspace{% endblock %}">
  {% include "icons.html" %}
  <a class="skip" href="#main">Ir al contenido</a>
  <header class="masthead">
    <a class="brand" href="/" aria-label="taskApp, inicio">
      <img src="/mark.svg" width="39" height="39" alt="">
      <span class="wordmark">task<span>App</span></span>
    </a>
    {% block navigation %}{% endblock %}
  </header>
  <main id="main" tabindex="-1">
    <p id="app-message" class="notice" role="status" hidden></p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

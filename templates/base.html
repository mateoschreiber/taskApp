<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>{% block title %}taskApp{% endblock %}</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">Ir al contenido</a>
  <header class="top">
    <div class="bar">
      <a class="brand" href="/" aria-label="taskApp, inicio"><span class="mark" aria-hidden="true">✓</span>taskApp</a>
      {% block navigation %}{% endblock %}
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p id="app-message" class="notice" role="status" hidden></p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

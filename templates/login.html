{% extends "base.html" %}
{% block title %}Iniciar sesión · taskApp{% endblock %}
{% block bodyclass %}access{% endblock %}
{% block content %}
<div class="login">
  <div class="login-art" aria-hidden="true">
    <p>Bitácora<br>de tienda<span>.</span></p>
    <img src="/jornada.png" width="760" height="466" alt="">
  </div>
  <section class="login-card" aria-labelledby="login-title">
    <span class="login-symbol"><svg class="ico" aria-hidden="true"><use href="#i-lock"/></svg></span>
    <h1 id="login-title">Iniciar sesión</h1>
    <p>Ingresa a tu registro de tareas diarias.</p>
    <form class="login-form" action="/login" method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if !error.is_empty() %}<p class="notice error-notice" role="alert">{{ error }}</p>{% endif %}
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{ username }}" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      </div>
      <button type="submit" class="primary">Entrar <svg class="ico" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </form>
  </section>
</div>
{% endblock %}

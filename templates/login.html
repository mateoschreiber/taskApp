{% extends "base.html" %}
{% block title %}Iniciar sesión · taskApp{% endblock %}
{% block content %}
<div class="login">
  <div class="heading">
    <h1>Iniciar sesión</h1>
    <p>Accede a tu registro de tareas.</p>
  </div>
  <form class="panel login-form" action="/login" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if !error.is_empty() %}<p class="notice error-notice" role="alert">{{ error }}</p>{% endif %}
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" value="{{ username }}" required maxlength="80">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
    </div>
    <button type="submit" class="primary">Entrar</button>
  </form>
</div>
{% endblock %}

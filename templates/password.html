{% extends "base.html" %}
{% block title %}Cambiar contraseña · taskApp{% endblock %}
{% block bodyclass %}access{% endblock %}
{% block content %}
<section class="login-card paper-card" aria-labelledby="passwd-title">
 <h1 id="passwd-title">Elige tu contraseña</h1>
 <p>Usa al menos 15 caracteres.</p>
 <form class="login-form" method="post" action="/cuenta/contrasena">
   <input type="hidden" name="csrf" value="{{ csrf }}">
   {% if !error.is_empty() %}<p class="notice error-notice" role="alert">{{ error }}</p>{% endif %}
   <div class="field"><label for="new-password">Nueva contraseña</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></div>
   <div class="field"><label for="repeat-password">Repite la contraseña</label><input id="repeat-password" name="repeat" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></div>
   <button class="primary" type="submit">Guardar contraseña</button>
 </form>
 <form method="post" action="/salir"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="quiet" type="submit">Cerrar sesión</button></form>
</section>
{% endblock %}

<nav class="nav" aria-label="Principal">
  <a href="/" {% if active == "today" %}aria-current="page"{% endif %}><svg class="ico" aria-hidden="true"><use href="#i-today"/></svg>Hoy</a>
  <a href="/tareas/nueva" {% if active == "task" %}aria-current="page"{% endif %}><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg>Nueva tarea</a>
  <a href="/historial" {% if active == "history" %}aria-current="page"{% else if active == "edit" || active == "export" %}aria-current="location"{% endif %}><svg class="ico" aria-hidden="true"><use href="#i-history"/></svg>Historial</a>
  <a href="/sin-conexion" data-pending {% if active == "device" %}aria-current="page"{% endif %}><svg class="ico" aria-hidden="true"><use href="#i-device"/></svg>Dispositivo <span class="queue-count" data-pending-count hidden></span></a>
</nav>
<div class="session-tools">
  <span class="connection" data-connection role="status" hidden><span class="signal" aria-hidden="true"></span><span data-connection-label></span></span>
  {% if !csrf.is_empty() %}
  <form action="/salir" method="post" class="signout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="logout" type="submit" aria-label="Cerrar sesión" title="Cerrar sesión"><svg class="ico" aria-hidden="true"><use href="#i-exit"/></svg><span>Cerrar sesión</span></button>
  </form>
  {% endif %}
</div>

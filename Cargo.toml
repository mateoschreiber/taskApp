[package]
name = "taskapp"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
askama = "0.14"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
rpassword = "7"
rust_xlsxwriter = { version = "0.96", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
